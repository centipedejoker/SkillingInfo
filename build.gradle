plugins {
	id 'java'
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.skillinginfo.SkillingInfoPluginTest'

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation 'org.mockito:mockito-core:3.0.0'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.skillinginfo'
version = '0.1.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

test {
	// src/test only holds SkillingInfoPluginTest, a manual-run launcher
	// (SPEC.md §67 / README "Running locally"), not JUnit tests - real
	// unit tests land here per §53-57 starting Phase 2. Until then, zero
	// discovered tests is expected, not a build failure.
	failOnNoDiscoveredTests = false
}

// ./gradlew run - launches the full RuneLite client with Skilling Info
// pre-loaded (SkillingInfoPluginTest), for local testing against a real
// account. See SPEC.md §67 / README.md "Running locally".
tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}
