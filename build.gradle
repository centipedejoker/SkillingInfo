plugins {
	id 'java'
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.skillinginfo.SkillingInfoPluginTest'

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation 'org.mockito:mockito-core:3.0.0'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.skillinginfo'
version = '0.1.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// NOTE: src/test also holds SkillingInfoPluginTest, which is a manual-run
// launcher (SPEC.md §67 / README "Running locally"), not a JUnit test.
// Real unit tests now live alongside it (BankCorrelatorTest, §55), so the
// default "fail if no tests were discovered" guard is left enabled.

// ./gradlew run - launches the full RuneLite client with Skilling Info
// pre-loaded (SkillingInfoPluginTest), for local testing against a real
// account. See SPEC.md §67 / README.md "Running locally".
tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	// RuneLite's OSXFullScreenAdapter uses com.apple.eawt directly, which
	// JDK 17's module system doesn't export by default - without this,
	// ClientUI.init() throws IllegalAccessError and the client never opens
	// (macOS only; harmless on Windows/Linux, kept unconditional for
	// simplicity since JavaExec ignores unrecognised --add-exports targets
	// on other platforms).
	jvmArgs "--add-exports=java.desktop/com.apple.eawt=ALL-UNNAMED"
	args "--developer-mode", "--debug"
}
